<!-- @dsCard group="Components" viewport="700x460" name="Commerce · ProductCard, OrderTracker" subtitle="Tarjeta de producto y seguimiento de pedido" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-body); }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .track { background: #fff; border: 1px solid var(--border-subtle); border-radius: var(--radius-card); padding: 20px 16px; box-shadow: var(--shadow-sm); margin-bottom: 16px; }
  i[data-lucide] { width: 100%; height: 100%; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { ProductCard, OrderTracker } = window.UTCPickSazNDesignSystem_c294ef;
    const I = (n) => <i data-lucide={n}></i>;
    function Demo() {
      return (
        <div>
          <div className="lbl">OrderTracker</div>
          <div className="track">
            <OrderTracker current={1} note="~12 min" />
          </div>
          <div className="lbl">ProductCard</div>
          <div className="cards">
            <ProductCard name="Quesadilla de tinga" category="Quesadillas" price={38} prepMin={12} popular icon={I('utensils-crossed')} />
            <ProductCard name="Agua de jamaica" category="Aguas frescas" price={18} status="Listo" tone="ready" readyAgo={4} icon={I('cup-soda')} />
            <ProductCard name="Papas con queso" category="Papas preparadas" price={32} status="Re-ofertado" tone="reoffer" icon={I('utensils')} />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && lucide.createIcons(), 80);
  </script>
</body>
</html>
