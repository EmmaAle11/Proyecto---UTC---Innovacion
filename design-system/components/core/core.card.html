<!-- @dsCard group="Components" viewport="700x430" name="Core · Botones, badges, chips" subtitle="Button · Badge · Chip · Card · Avatar" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-body); }
  .group { margin-bottom: 18px; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  i[data-lucide] { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { Button, Badge, Chip, Card, Avatar } = window.UTCPickSazNDesignSystem_c294ef;
    const I = (n, c) => <i data-lucide={n} style={c ? { color: c } : null}></i>;
    function Demo() {
      return (
        <div>
          <div className="group">
            <div className="lbl">Button · variantes</div>
            <div className="row">
              <Button variant="primary" leftIcon={I('shopping-bag')}>Agregar · $38</Button>
              <Button variant="institutional">Mi pedido</Button>
              <Button variant="secondary" leftIcon={I('map-pin')}>Recoger</Button>
              <Button variant="soft">Ver más</Button>
              <Button variant="ghost">Cancelar</Button>
              <Button variant="danger">Quitar</Button>
            </div>
          </div>
          <div className="group">
            <div className="lbl">Button · tamaños y estado</div>
            <div className="row">
              <Button size="sm">Pequeño</Button>
              <Button size="md">Mediano</Button>
              <Button size="lg" rightIcon={I('arrow-right')}>Grande</Button>
              <Button loading>Cargando</Button>
              <Button disabled>Agotado</Button>
            </div>
          </div>
          <div className="group">
            <div className="lbl">Badge · estados de pedido</div>
            <div className="row">
              <Badge tone="cooking" dot>Por preparar · ~12 min</Badge>
              <Badge tone="ready" dot>Listo para recoger</Badge>
              <Badge tone="reoffer">↻ Re-ofertado</Badge>
              <Badge tone="primary">Popular</Badge>
              <Badge tone="success" dot>Pagado</Badge>
              <Badge tone="neutral">Sin gluten</Badge>
            </div>
          </div>
          <div className="group">
            <div className="lbl">Chip · categorías &nbsp;·&nbsp; Avatar</div>
            <div className="row">
              <Chip selected icon={I('flame')}>Todo</Chip>
              <Chip icon={I('cup-soda')}>Aguas</Chip>
              <Chip>Quesadillas</Chip>
              <span style={{ width: 12 }}></span>
              <Avatar name="Mariana Reyes" />
              <Avatar name="Bruno Lara" size="lg" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && lucide.createIcons(), 80);
  </script>
</body>
</html>
