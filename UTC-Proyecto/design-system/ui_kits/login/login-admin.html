<!-- @dsCard group="App móvil" viewport="430x780" name="Login · Admin" subtitle="Panel de administración · Azul institucional · Keycloak local" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTC Pick Sazón · Login Administrador</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--gris-100); display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
  i[data-lucide] { width: 100%; height: 100%; stroke-width: 2; }
  * { box-sizing: border-box; }
  input:-webkit-autofill { -webkit-box-shadow: 0 0 0 40px #fff inset; -webkit-text-fill-color: var(--azul-700); }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect } = React;
const Ic = ({ n, s }) => <i data-lucide={n} style={s}></i>;

/* ---- phone shell ---- */
function Phone({ children, darkBar = false }) {
  return (
    <div style={{ width:390, height:800, background:'#000', borderRadius:46, padding:11, boxShadow:'0 24px 56px rgba(2,22,66,.22)', flex:'none' }}>
      <div style={{ width:'100%', height:'100%', background:'var(--surface-page)', borderRadius:36, overflow:'hidden', display:'flex', flexDirection:'column', position:'relative' }}>
        <div style={{ height:44, flex:'none', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 26px', zIndex:5 }}>
          <span style={{ fontFamily:'var(--font-mono)', fontWeight:700, fontSize:14, color: darkBar ? '#fff' : 'var(--text-heading)' }}>9:41</span>
          <span style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', top:9, width:110, height:26, background:'#000', borderRadius:14 }}></span>
          <span style={{ display:'inline-flex', gap:5, alignItems:'center', color: darkBar ? '#fff' : 'var(--text-heading)' }}>
            <span style={{ width:15,height:11,display:'inline-flex' }}><Ic n="signal"/></span>
            <span style={{ width:17,height:11,display:'inline-flex' }}><Ic n="battery-full"/></span>
          </span>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ---- input field ---- */
function Field({ label, type='text', placeholder, value, onChange, error, leftIcon, rightSlot, hint }) {
  const [focus, setFocus] = useState(false);
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
      <label style={{ fontSize:13, fontWeight:700, color:'var(--text-heading)' }}>{label}</label>
      <div style={{ display:'flex', alignItems:'center', gap:10, height:52, padding:'0 15px',
        background:'#fff', borderRadius:14,
        border: error ? '1.5px solid var(--color-danger)' : focus ? '1.5px solid var(--naranja-500)' : '1.5px solid var(--border-default)',
        boxShadow: focus ? 'var(--ring-primary)' : 'none',
        transition:'border-color .12s, box-shadow .12s' }}>
        {leftIcon && <span style={{ width:18, height:18, color: error ? 'var(--color-danger)' : 'var(--text-muted)', display:'inline-flex', flex:'none' }}>{leftIcon}</span>}
        <input type={type} placeholder={placeholder} value={value} onChange={e => onChange(e.target.value)}
          onFocus={() => setFocus(true)} onBlur={() => setFocus(false)}
          style={{ flex:1, border:'none', outline:'none', background:'transparent', fontFamily:'var(--font-body)', fontSize:15, color:'var(--text-heading)', minWidth:0 }} />
        {rightSlot}
      </div>
      {error && <span style={{ fontSize:12, color:'var(--color-danger)', fontWeight:600 }}>{error}</span>}
      {!error && hint && <span style={{ fontSize:12, color:'var(--text-muted)' }}>{hint}</span>}
    </div>
  );
}

/* ---- screen ---- */
function LoginAdmin() {
  const [email, setEmail] = useState('');
  const [pass, setPass] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [error, setError] = useState('');
  const [loading, setLoading] = useState(false);
  const [success, setSuccess] = useState(false);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const validate = () => {
    if (!email) return 'Ingresa tu correo institucional';
    if (!email.includes('@')) return 'Correo inválido';
    if (!pass) return 'Ingresa tu contraseña';
    if (pass.length < 4) return 'Contraseña incorrecta';
    return '';
  };

  const handleLogin = () => {
    const e = validate();
    if (e) { setError(e); return; }
    setError(''); setLoading(true);
    setTimeout(() => { setLoading(false); setSuccess(true); }, 1800);
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', background:'#fff', overflow:'hidden', position:'relative' }}>

      {/* header band */}
      <div style={{ background:'var(--azul-700)', padding:'28px 26px 32px', position:'relative', overflow:'hidden', flex:'none' }}>
        <div style={{ position:'absolute', top:-60, right:-50, width:180, height:180, borderRadius:'50%', background:'rgba(227,65,0,.20)' }}></div>
        <div style={{ position:'absolute', bottom:-60, left:-30, width:150, height:150, borderRadius:'50%', background:'rgba(255,255,255,.05)' }}></div>
        <div style={{ position:'relative', zIndex:2 }}>
          <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:16 }}>
            <span style={{ width:38, height:38, borderRadius:11, background:'var(--naranja-500)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>
              <svg width="22" height="22" viewBox="0 0 96 96">
                <path d="M48 22c-11.6 0-21 9.1-21 20.4 0 14.2 17.6 29.3 19.6 31a2.2 2.2 0 0 0 2.8 0c2-1.7 19.6-16.8 19.6-31C69 31.1 59.6 22 48 22Z" fill="#fff"/>
                <circle cx="48" cy="42" r="8.4" fill="var(--naranja-500)"/>
              </svg>
            </span>
            <div>
              <div style={{ fontFamily:'var(--font-display)', fontWeight:800, fontSize:18, color:'#fff', lineHeight:1 }}>
                Pick <span style={{ color:'var(--naranja-400)' }}>Sazón</span>
              </div>
              <div style={{ fontSize:11, color:'var(--azul-200)', fontWeight:600, letterSpacing:'.04em', textTransform:'uppercase', marginTop:2 }}>Panel de administración</div>
            </div>
          </div>
          <div style={{ display:'inline-flex', alignItems:'center', gap:7, padding:'6px 12px 6px 8px', background:'rgba(255,255,255,.10)', borderRadius:999 }}>
            <span style={{ width:16, height:16, display:'inline-flex', alignItems:'center', justifyContent:'center', color:'var(--naranja-400)', flex:'none' }}><Ic n="shield-check"/></span>
            <span style={{ fontSize:12.5, fontWeight:600, color:'var(--azul-100)', lineHeight:1 }}>Acceso restringido · Solo administradores</span>
          </div>
        </div>
      </div>

      {/* form */}
      <div style={{ flex:1, overflowY:'auto', padding:'28px 26px 30px' }}>
        {success ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:14, paddingTop:40 }}>
            <span style={{ width:64, height:64, borderRadius:'50%', background:'var(--lima-50)', display:'inline-flex', alignItems:'center', justifyContent:'center' }}>
              <span style={{ width:34, height:34, display:'inline-flex', color:'var(--lima-500)' }}><Ic n="check-circle-2"/></span>
            </span>
            <div style={{ fontFamily:'var(--font-display)', fontWeight:800, fontSize:24, color:'var(--text-heading)', textAlign:'center' }}>¡Bienvenido!</div>
            <p style={{ margin:0, fontSize:14.5, color:'var(--gris-600)', textAlign:'center', lineHeight:1.5 }}>Sesión iniciada. Redirigiendo al panel de cocina…</p>
          </div>
        ) : (
          <div style={{ display:'flex', flexDirection:'column', gap:20 }}>
            <div>
              <h2 style={{ fontSize:26, margin:'0 0 4px' }}>Iniciar sesión</h2>
              <p style={{ margin:0, fontSize:14, color:'var(--text-muted)' }}>Usa tus credenciales de administrador.</p>
            </div>

            {error && (
              <div style={{ display:'flex', gap:9, padding:'11px 14px', background:'var(--rojo-50)', border:'1px solid rgba(215,38,61,.18)', borderRadius:12 }}>
                <span style={{ width:17, height:17, display:'inline-flex', color:'var(--color-danger)', flex:'none', marginTop:1 }}><Ic n="alert-circle"/></span>
                <span style={{ fontSize:13.5, color:'var(--rojo-600)', fontWeight:500 }}>{error}</span>
              </div>
            )}

            <Field
              label="Correo"
              type="email"
              placeholder="admin@utc.edu.ec"
              value={email}
              onChange={v => { setEmail(v); setError(''); }}
              leftIcon={<Ic n="mail"/>}
              hint="Cuenta de administrador UTC"
            />

            <Field
              label="Contraseña"
              type={showPass ? 'text' : 'password'}
              placeholder="••••••••"
              value={pass}
              onChange={v => { setPass(v); setError(''); }}
              leftIcon={<Ic n="lock"/>}
              rightSlot={
                <button onClick={() => setShowPass(s => !s)} style={{ background:'none', border:'none', cursor:'pointer', padding:4, display:'inline-flex', width:26, height:26, color:'var(--text-muted)' }}>
                  <Ic n={showPass ? 'eye-off' : 'eye'}/>
                </button>
              }
            />

            <button onClick={handleLogin} disabled={loading} style={{
              height:54, borderRadius:16, border:'none', cursor: loading ? 'default' : 'pointer',
              background:'var(--azul-700)', color:'#fff', fontFamily:'var(--font-body)',
              fontWeight:700, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center', gap:10,
              boxShadow:'0 8px 22px rgba(2,22,66,.28)', transition:'filter .12s',
              opacity: loading ? .85 : 1,
            }}
              onMouseDown={e => { if (!loading) e.currentTarget.style.filter='brightness(0.9)'; }}
              onMouseUp={e => { e.currentTarget.style.filter='none'; }}
            >
              {loading
                ? <span style={{ width:22, height:22, borderRadius:'50%', border:'2.5px solid rgba(255,255,255,.3)', borderTopColor:'#fff', display:'inline-block', animation:'spin .7s linear infinite' }}></span>
                : <span style={{ width:20, height:20, display:'inline-flex' }}><Ic n="log-in"/></span>
              }
              {loading ? 'Verificando…' : 'Entrar al panel'}
            </button>


          </div>
        )}
      </div>
      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Phone darkBar={true}><LoginAdmin /></Phone>
);
setTimeout(() => window.lucide && lucide.createIcons(), 60);
</script>
</body>
</html>
