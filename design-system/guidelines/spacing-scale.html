<!-- @dsCard group="Spacing" viewport="700x170" name="Escala de espaciado" subtitle="Base 4px · 1–20" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; align-items: flex-end; gap: 16px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .bar { background: var(--naranja-200); border-radius: 4px; width: 100%; }
  .box { background: var(--naranja-500); border-radius: 3px; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="box" style="width:4px;height:4px"></span><span class="lab">1·4</span></div>
    <div class="item"><span class="box" style="width:8px;height:8px"></span><span class="lab">2·8</span></div>
    <div class="item"><span class="box" style="width:12px;height:12px"></span><span class="lab">3·12</span></div>
    <div class="item"><span class="box" style="width:16px;height:16px"></span><span class="lab">4·16</span></div>
    <div class="item"><span class="box" style="width:20px;height:20px"></span><span class="lab">5·20</span></div>
    <div class="item"><span class="box" style="width:24px;height:24px"></span><span class="lab">6·24</span></div>
    <div class="item"><span class="box" style="width:32px;height:32px"></span><span class="lab">8·32</span></div>
    <div class="item"><span class="box" style="width:40px;height:40px"></span><span class="lab">10·40</span></div>
    <div class="item"><span class="box" style="width:48px;height:48px"></span><span class="lab">12·48</span></div>
    <div class="item"><span class="box" style="width:64px;height:64px"></span><span class="lab">16·64</span></div>
  </div>
</body>
</html>
