<!-- @dsCard group="App móvil" viewport="430x780" name="Login · Usuario" subtitle="Propuesta B · Naranja · Inicio de sesión con Outlook @utc.edu.ec" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTC Pick Sazón · Login Usuario</title>
<link rel="stylesheet" href="../../styles.css">
<style>
  html, body { margin: 0; height: 100%; background: var(--gris-100); display: flex; align-items: center; justify-content: center; font-family: var(--font-body); }
  i[data-lucide] { width: 100%; height: 100%; stroke-width: 2; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

/* ---- glyphs ---- */
const MsGlyph = () => (
  <svg width="20" height="20" viewBox="0 0 23 23" style={{ flex:'none' }}>
    <rect x="1"  y="1"  width="10" height="10" fill="#F25022"/>
    <rect x="12" y="1"  width="10" height="10" fill="#7FBA00"/>
    <rect x="1"  y="12" width="10" height="10" fill="#00A4EF"/>
    <rect x="12" y="12" width="10" height="10" fill="#FFB900"/>
  </svg>
);
const PinIcon = ({ size = 44, bg = 'var(--naranja-500)', pin = '#fff' }) => (
  <span style={{ width: size, height: size, borderRadius: size * 0.28, background: bg, display:'inline-flex', alignItems:'center', justifyContent:'center', flex:'none' }}>
    <svg width={size * 0.56} height={size * 0.56} viewBox="0 0 96 96">
      <path d="M48 22c-11.6 0-21 9.1-21 20.4 0 14.2 17.6 29.3 19.6 31a2.2 2.2 0 0 0 2.8 0c2-1.7 19.6-16.8 19.6-31C69 31.1 59.6 22 48 22Z" fill={pin}/>
      <circle cx="48" cy="42" r="8.4" fill={bg}/>
    </svg>
  </span>
);
const Ic = ({ n, s }) => <i data-lucide={n} style={s}></i>;

/* ---- phone shell ---- */
function Phone({ children }) {
  return (
    <div style={{ width: 390, height: 800, background: '#000', borderRadius: 46, padding: 11, boxShadow: '0 24px 56px rgba(2,22,66,.22)', flex:'none' }}>
      <div style={{ width:'100%', height:'100%', background:'var(--surface-page)', borderRadius: 36, overflow:'hidden', display:'flex', flexDirection:'column', position:'relative' }}>
        {/* status bar */}
        <div style={{ height: 44, flex:'none', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'0 26px', zIndex: 5, background:'transparent' }}>
          <span style={{ fontFamily:'var(--font-mono)', fontWeight:700, fontSize:14, color:'#fff' }}>9:41</span>
          <span style={{ position:'absolute', left:'50%', transform:'translateX(-50%)', top:9, width:110, height:26, background:'#000', borderRadius:14 }}></span>
          <span style={{ display:'inline-flex', gap:5, alignItems:'center', color:'#fff' }}>
            <span style={{ width:15,height:11,display:'inline-flex' }}><Ic n="signal"/></span>
            <span style={{ width:17,height:11,display:'inline-flex' }}><Ic n="battery-full"/></span>
          </span>
        </div>
        {children}
      </div>
    </div>
  );
}

/* ---- screen ---- */
function LoginUsuario() {
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  useEffect(() => { if (window.lucide) window.lucide.createIcons(); });

  const handleLogin = () => {
    setLoading(true);
    setTimeout(() => { setLoading(false); setDone(true); }, 1600);
  };

  return (
    <div style={{ flex:1, display:'flex', flexDirection:'column', position:'relative', overflow:'hidden',
      background:'linear-gradient(158deg, var(--naranja-500) 0%, var(--naranja-600) 55%, var(--naranja-700) 100%)' }}>

      {/* blobs decorativos */}
      <div style={{ position:'absolute', top:-80, right:-60, width:230, height:230, borderRadius:'50%', background:'rgba(255,255,255,.10)', pointerEvents:'none' }}></div>
      <div style={{ position:'absolute', bottom:180, left:-80, width:200, height:200, borderRadius:'50%', background:'rgba(2,22,66,.12)', pointerEvents:'none' }}></div>
      <div style={{ position:'absolute', top:200, right:-40, width:130, height:130, borderRadius:'50%', background:'rgba(255,255,255,.06)', pointerEvents:'none' }}></div>

      {/* hero */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', padding:'0 30px', position:'relative', zIndex:2 }}>
        <PinIcon size={68} bg="#fff" pin="var(--naranja-500)" />

        <h1 style={{ color:'#fff', fontSize:42, lineHeight:1.02, margin:'26px 0 12px', fontFamily:'var(--font-display)', fontWeight:800, letterSpacing:'-0.02em' }}>
          Tu antojo,<br/>al mostrador.
        </h1>
        <p style={{ color:'rgba(255,255,255,.88)', fontSize:16, lineHeight:1.55, margin:0, maxWidth:290 }}>
          Pide desde tu celular y recoge en la cooperativa cuando esté listo. Sin filas, sin esperas a ciegas.
        </p>

        {/* feature pills */}
        <div style={{ display:'flex', flexWrap:'wrap', gap:8, marginTop:22 }}>
          {['⏱ Tiempos visibles', '📍 Pick Up', '✓ Paga con tarjeta'].map(f => (
            <span key={f} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'6px 12px', borderRadius:999, background:'rgba(255,255,255,.15)', color:'#fff', fontSize:12.5, fontWeight:600 }}>{f}</span>
          ))}
        </div>
      </div>

      {/* CTA block */}
      <div style={{ padding:'0 22px 40px', position:'relative', zIndex:2, display:'flex', flexDirection:'column', gap:12 }}>

        {done ? (
          <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10, padding:'18px', background:'rgba(255,255,255,.15)', borderRadius:20, color:'#fff' }}>
            <span style={{ width:36, height:36, display:'inline-flex' }}><Ic n="check-circle-2"/></span>
            <span style={{ fontWeight:700, fontSize:15 }}>Redirigiendo a Outlook…</span>
            <span style={{ fontSize:12.5, opacity:.85 }}>Completa el inicio de sesión con tu cuenta @utc.edu.ec</span>
          </div>
        ) : (
          <button onClick={handleLogin} disabled={loading} style={{
            display:'flex', alignItems:'center', justifyContent:'center', gap:11,
            height:54, borderRadius:18, border:'none', cursor: loading ? 'default' : 'pointer',
            background:'#fff', boxShadow:'0 8px 24px rgba(2,22,66,.18)',
            fontFamily:'var(--font-body)', fontWeight:700, fontSize:16, color:'var(--azul-700)',
            transition:'transform .12s, box-shadow .12s', opacity: loading ? .85 : 1,
          }}
            onMouseDown={e => { e.currentTarget.style.transform='scale(.985)'; e.currentTarget.style.boxShadow='0 4px 12px rgba(2,22,66,.14)'; }}
            onMouseUp={e => { e.currentTarget.style.transform='scale(1)'; e.currentTarget.style.boxShadow='0 8px 24px rgba(2,22,66,.18)'; }}
          >
            {loading
              ? <span style={{ width:22, height:22, borderRadius:'50%', border:'2.5px solid var(--azul-200)', borderTopColor:'var(--azul-700)', display:'inline-block', animation:'spin .7s linear infinite' }}></span>
              : <MsGlyph />
            }
            {loading ? 'Conectando con Outlook…' : 'Iniciar sesión con Outlook'}
          </button>
        )}

        {/* disclaimer */}
        <div style={{ display:'flex', alignItems:'flex-start', gap:9, padding:'12px 14px', background:'rgba(2,22,66,.18)', borderRadius:14 }}>
          <span style={{ width:16, height:16, display:'inline-flex', color:'rgba(255,255,255,.7)', flex:'none', marginTop:1 }}><Ic n="info"/></span>
          <p style={{ margin:0, fontSize:12.5, color:'rgba(255,255,255,.85)', lineHeight:1.45 }}>
            Usamos tu cuenta institucional <strong style={{ color:'#fff' }}>@utc.edu.ec</strong> gestionada por Microsoft Outlook. No creamos una contraseña adicional.
          </p>
        </div>

        <p style={{ textAlign:'center', fontSize:11.5, color:'rgba(255,255,255,.55)', margin:'2px 0 0' }}>
          Modalidad Pick Up · Solo recogida en tienda
        </p>
      </div>

      <style>{`@keyframes spin{to{transform:rotate(360deg)}}`}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <Phone><LoginUsuario /></Phone>
);
setTimeout(() => window.lucide && lucide.createIcons(), 60);
</script>
</body>
</html>
