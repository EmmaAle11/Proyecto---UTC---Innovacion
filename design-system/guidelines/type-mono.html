<!-- @dsCard group="Type" viewport="700x170" name="Numérico · Space Mono" subtitle="Precios, temporizadores y códigos de pedido" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); font-family: var(--font-body); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 16px; }
  .row { display: flex; gap: 28px; align-items: baseline; }
  .item { display: flex; flex-direction: column; gap: 4px; }
  .val { font-family: var(--font-mono); font-weight: 700; color: var(--text-heading); }
  .cap { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="meta">Space Mono · tabular numerals (tnum)</div>
  <div class="row">
    <div class="item"><span class="val" style="font-size:34px; color:var(--naranja-500)">$38.00</span><span class="cap">Precio</span></div>
    <div class="item"><span class="val" style="font-size:34px">12:45</span><span class="cap">Temporizador</span></div>
    <div class="item"><span class="val" style="font-size:34px">#A-204</span><span class="cap">Código de pedido</span></div>
    <div class="item"><span class="val" style="font-size:34px">×3</span><span class="cap">Cantidad</span></div>
  </div>
</body>
</html>
