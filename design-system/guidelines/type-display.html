<!-- @dsCard group="Type" viewport="700x240" name="Display · Bricolage Grotesque" subtitle="Encabezados y titulares con carácter" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); margin-bottom: 14px; }
  .big { font-family: var(--font-display); font-weight: 800; color: var(--text-heading); line-height: 1.05; letter-spacing: -0.02em; margin: 0 0 6px; }
  .row { display: flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
  .tag { font-family: var(--font-mono); font-size: 10px; color: var(--text-subtle); }
</style>
</head>
<body>
  <div class="meta">Bricolage Grotesque · 800 · tracking −0.02em</div>
  <div class="row"><span class="big" style="font-size:48px">Pide fácil</span><span class="tag">48 / 4xl</span></div>
  <div class="row"><span class="big" style="font-size:36px">Recoge con sabor</span><span class="tag">36 / 3xl</span></div>
  <div class="row"><span class="big" style="font-size:28px; color:var(--naranja-500)">Antojo resuelto</span><span class="tag">28 / 2xl</span></div>
</body>
</html>
