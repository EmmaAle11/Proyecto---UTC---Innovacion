<!-- @dsCard group="Brand" viewport="700x230" name="Logotipo" subtitle="Marca de recogida + wordmark · sobre claro y azul" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 0; background: var(--surface-card); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; height: 230px; }
  .panel { display: flex; align-items: center; gap: 18px; padding: 28px; }
  .light { background: #fff; }
  .dark { background: var(--azul-700); }
  .lock { display: flex; align-items: center; gap: 14px; }
  .mark { width: 56px; height: 56px; border-radius: 15px; display: flex; align-items: center; justify-content: center; flex: none; }
  .wm { font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -0.02em; line-height: 1; }
  .tag { font-family: var(--font-body); font-weight: 600; font-size: 11px; letter-spacing: .02em; margin-top: 5px; }
  svg .pin { fill: #fff; }
</style>
</head>
<body>
  <div class="grid">
    <div class="panel light">
      <div class="lock">
        <span class="mark" style="background:var(--naranja-500)">
          <svg width="34" height="34" viewBox="0 0 96 96"><path class="pin" d="M48 22c-11.6 0-21 9.1-21 20.4 0 14.2 17.6 29.3 19.6 31a2.2 2.2 0 0 0 2.8 0c2-1.7 19.6-16.8 19.6-31C69 31.1 59.6 22 48 22Z"/><circle cx="48" cy="42" r="8.4" fill="#E34100"/></svg>
        </span>
        <div>
          <div class="wm" style="color:var(--azul-700)">Pick <span style="color:var(--naranja-500)">Sazón</span></div>
          <div class="tag" style="color:var(--gris-500)">Pide fácil, recoge con sabor</div>
        </div>
      </div>
    </div>
    <div class="panel dark">
      <div class="lock">
        <span class="mark" style="background:#fff">
          <svg width="34" height="34" viewBox="0 0 96 96"><path d="M48 22c-11.6 0-21 9.1-21 20.4 0 14.2 17.6 29.3 19.6 31a2.2 2.2 0 0 0 2.8 0c2-1.7 19.6-16.8 19.6-31C69 31.1 59.6 22 48 22Z" fill="#E34100"/><circle cx="48" cy="42" r="8.4" fill="#fff"/></svg>
        </span>
        <div>
          <div class="wm" style="color:#fff">Pick <span style="color:var(--naranja-400)">Sazón</span></div>
          <div class="tag" style="color:var(--azul-200)">Pide fácil, recoge con sabor</div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
