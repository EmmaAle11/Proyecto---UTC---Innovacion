<!-- @dsCard group="Colors" viewport="700x150" name="Estado del sistema" subtitle="success · warning · danger · info" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); height: 96px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; color: #fff; }
  .n { font-weight: 700; font-size: 14px; }
  .h { font-family: var(--font-mono); font-size: 12px; opacity: .9; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--color-success)"><span class="n">Success</span><span class="h">#15915B</span></div>
    <div class="sw" style="background:var(--color-warning); color:var(--azul-800)"><span class="n">Warning</span><span class="h">#F2A900</span></div>
    <div class="sw" style="background:var(--color-danger)"><span class="n">Danger</span><span class="h">#D7263D</span></div>
    <div class="sw" style="background:var(--color-info)"><span class="n">Info</span><span class="h">#1A4099</span></div>
  </div>
</body>
</html>
