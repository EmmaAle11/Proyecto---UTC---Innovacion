<!-- @dsCard group="Colors" viewport="700x150" name="Escala · Azul" subtitle="Azul institucional 50–900 (identidad / tinta)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .scale { display: flex; gap: 6px; }
  .chip { flex: 1; border-radius: 10px; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; border: 1px solid rgba(2,22,66,.06); }
  .n { font-size: 11px; font-weight: 700; }
  .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .9; }
  .light { color: var(--azul-700); }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="scale">
    <div class="chip light" style="background:var(--azul-50)"><span class="n">50</span><span class="h">#EDF1FA</span></div>
    <div class="chip light" style="background:var(--azul-100)"><span class="n">100</span><span class="h">#D4DCF1</span></div>
    <div class="chip light" style="background:var(--azul-200)"><span class="n">200</span><span class="h">#A6B6E0</span></div>
    <div class="chip dark" style="background:var(--azul-300)"><span class="n">300</span><span class="h">#6982C9</span></div>
    <div class="chip dark" style="background:var(--azul-400)"><span class="n">400</span><span class="h">#3358B8</span></div>
    <div class="chip dark" style="background:var(--azul-500)"><span class="n">500</span><span class="h">#1A4099</span></div>
    <div class="chip dark" style="background:var(--azul-600)"><span class="n">600</span><span class="h">#0A2E7A</span></div>
    <div class="chip dark" style="background:var(--azul-700)"><span class="n">700</span><span class="h">#021E5E</span></div>
    <div class="chip dark" style="background:var(--azul-800)"><span class="n">800</span><span class="h">#021642</span></div>
    <div class="chip dark" style="background:var(--azul-900)"><span class="n">900</span><span class="h">#010E2E</span></div>
  </div>
</body>
</html>
