<!-- @dsCard group="Colors" viewport="700x190" name="Marca · Institucional" subtitle="Azul + Naranja institucional UTC sobre blanco" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; min-height: 140px; border: 1px solid var(--border-subtle); }
  .name { font-weight: 700; font-size: 14px; }
  .hex { font-family: var(--font-mono); font-size: 13px; opacity: .82; }
  .use { font-size: 12px; opacity: .8; line-height: 1.35; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background: var(--azul-700); color: #fff;">
      <div class="name">Azul institucional</div>
      <div class="use">Identidad, encabezados, fondos institucionales.</div>
      <div class="hex">#021E5E</div>
    </div>
    <div class="sw" style="background: var(--naranja-500); color: #fff;">
      <div class="name">Naranja institucional</div>
      <div class="use">Acentos, botones, llamadas de atención.</div>
      <div class="hex">#E34100</div>
    </div>
    <div class="sw" style="background: #fff; color: var(--azul-700);">
      <div class="name">Blanco de apoyo</div>
      <div class="use">Fondos limpios, contraste, espacios negativos.</div>
      <div class="hex">#FFFFFF</div>
    </div>
  </div>
</body>
</html>
