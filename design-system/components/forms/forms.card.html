<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px 28px; align-items: start; }
  .lbl { font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 12px; }
  i[data-lucide] { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div id="root"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="../../_ds_bundle.js"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script type="text/babel" data-presets="react">
    const { Input, QtyStepper } = window.UTCPickSazNDesignSystem_c294ef;
    const I = (n) => <i data-lucide={n}></i>;
    function Demo() {
      const [qty, setQty] = React.useState(2);
      return (
        <div className="grid">
          <div>
            <div className="lbl">Input</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <Input label="Correo institucional" placeholder="tu@utc.edu" leftIcon={I('mail')} />
              <Input label="Buscar antojo" placeholder="papas, agua de jamaica…" leftIcon={I('search')} />
            </div>
          </div>
          <div>
            <div className="lbl">Input · error &nbsp;·&nbsp; QtyStepper</div>
            <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
              <Input label="Código de recogida" defaultValue="A-2X" error="Código incorrecto, revisa tu correo" />
              <div>
                <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-heading)', marginBottom: 8 }}>Cantidad</div>
                <QtyStepper value={qty} min={1} max={10} onChange={setQty} />
              </div>
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
    setTimeout(() => window.lucide && lucide.createIcons(), 80);
  </script>
</body>
</html>
