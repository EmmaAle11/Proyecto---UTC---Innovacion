<!-- @dsCard group="Brand" viewport="700x180" name="Iconografía · Lucide" subtitle="Stroke 2px, esquinas redondeadas — íconos de la app" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; }
  .ico { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 76px; }
  .ico svg { width: 26px; height: 26px; stroke: var(--azul-700); stroke-width: 2; }
  .lab { font-size: 10.5px; color: var(--text-muted); font-family: var(--font-mono); }
</style>
</head>
<body>
  <div class="row">
    <div class="ico"><i data-lucide="utensils-crossed"></i><span class="lab">menú</span></div>
    <div class="ico"><i data-lucide="shopping-bag"></i><span class="lab">pedido</span></div>
    <div class="ico"><i data-lucide="timer"></i><span class="lab">espera</span></div>
    <div class="ico"><i data-lucide="map-pin"></i><span class="lab">recoger</span></div>
    <div class="ico"><i data-lucide="bell"></i><span class="lab">avisos</span></div>
    <div class="ico"><i data-lucide="credit-card"></i><span class="lab">pago</span></div>
    <div class="ico"><i data-lucide="search"></i><span class="lab">buscar</span></div>
    <div class="ico"><i data-lucide="flame" style="stroke:var(--naranja-500)"></i><span class="lab">popular</span></div>
    <div class="ico"><i data-lucide="check-circle-2" style="stroke:var(--lima-500)"></i><span class="lab">listo</span></div>
    <div class="ico"><i data-lucide="plus"></i><span class="lab">agregar</span></div>
    <div class="ico"><i data-lucide="cup-soda"></i><span class="lab">bebida</span></div>
    <div class="ico"><i data-lucide="user"></i><span class="lab">perfil</span></div>
  </div>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
