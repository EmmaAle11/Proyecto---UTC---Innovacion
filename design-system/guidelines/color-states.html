<!-- @dsCard group="Colors" viewport="700x190" name="Estados de pedido" subtitle="Semántica de comida: por preparar · listo · re-ofertado" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-body); }
  .row { display: flex; gap: 14px; }
  .card { flex: 1; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); overflow: hidden; }
  .head { padding: 12px 14px; display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: var(--radius-pill); font-size: 12.5px; font-weight: 700; margin: 12px 14px; }
  .meta { padding: 0 14px 14px; font-size: 11.5px; color: var(--text-muted); line-height: 1.4; }
</style>
</head>
<body>
  <div class="row">
    <div class="card">
      <div class="head" style="background:var(--state-cooking-bg); color:var(--state-cooking-fg)"><span class="dot" style="background:var(--state-cooking-dot)"></span>Por preparar</div>
      <span class="pill" style="background:var(--state-cooking-bg); color:var(--state-cooking-fg)">⏱ ~12 min</span>
      <div class="meta">Ámbar mango. Pedido en cocina con tiempo estimado de espera.</div>
    </div>
    <div class="card">
      <div class="head" style="background:var(--state-ready-bg); color:var(--state-ready-fg)"><span class="dot" style="background:var(--state-ready-dot)"></span>Listo para recoger</div>
      <span class="pill" style="background:var(--state-ready-bg); color:var(--state-ready-fg)">✓ Preparado hace 4 min</span>
      <div class="meta">Verde lima. Producto terminado; ventana de recogida 10–20 min.</div>
    </div>
    <div class="card">
      <div class="head" style="background:var(--state-reoffer-bg); color:var(--state-reoffer-fg)"><span class="dot" style="background:var(--state-reoffer-dot)"></span>Preparados</div>
      <span class="pill" style="background:var(--state-reoffer-bg); color:var(--state-reoffer-fg)">↻ Re-ofertado</span>
      <div class="meta">Naranja. Pasó la ventana de recogida y vuelve a ofertarse.</div>
    </div>
  </div>
</body>
</html>
