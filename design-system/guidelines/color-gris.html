<!-- @dsCard group="Colors" viewport="700x150" name="Escala · Gris neutro" subtitle="Neutros fríos anclados al azul (texto, bordes, superficies)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .scale { display: flex; gap: 6px; }
  .chip { flex: 1; border-radius: 10px; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; border: 1px solid rgba(2,22,66,.06); }
  .n { font-size: 11px; font-weight: 700; }
  .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .9; }
  .light { color: var(--gris-700); }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="scale">
    <div class="chip light" style="background:var(--gris-50)"><span class="n">50</span><span class="h">#F6F7F9</span></div>
    <div class="chip light" style="background:var(--gris-100)"><span class="n">100</span><span class="h">#EDEFF3</span></div>
    <div class="chip light" style="background:var(--gris-200)"><span class="n">200</span><span class="h">#DEE2EA</span></div>
    <div class="chip light" style="background:var(--gris-300)"><span class="n">300</span><span class="h">#C7CDD9</span></div>
    <div class="chip light" style="background:var(--gris-400)"><span class="n">400</span><span class="h">#9BA4B5</span></div>
    <div class="chip dark" style="background:var(--gris-500)"><span class="n">500</span><span class="h">#6C7689</span></div>
    <div class="chip dark" style="background:var(--gris-600)"><span class="n">600</span><span class="h">#4A5468</span></div>
    <div class="chip dark" style="background:var(--gris-700)"><span class="n">700</span><span class="h">#353D4E</span></div>
    <div class="chip dark" style="background:var(--gris-800)"><span class="n">800</span><span class="h">#232A38</span></div>
    <div class="chip dark" style="background:var(--gris-900)"><span class="n">900</span><span class="h">#141926</span></div>
  </div>
</body>
</html>
