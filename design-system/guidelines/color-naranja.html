<!-- @dsCard group="Colors" viewport="700x150" name="Escala · Naranja" subtitle="Naranja institucional 50–900 (acción primaria)" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .scale { display: flex; gap: 6px; }
  .chip { flex: 1; border-radius: 10px; height: 88px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; border: 1px solid rgba(2,22,66,.06); }
  .n { font-size: 11px; font-weight: 700; }
  .h { font-family: var(--font-mono); font-size: 9.5px; opacity: .9; }
  .light { color: var(--gris-700); }
  .dark { color: #fff; }
</style>
</head>
<body>
  <div class="scale">
    <div class="chip light" style="background:var(--naranja-50)"><span class="n">50</span><span class="h">#FFF1EB</span></div>
    <div class="chip light" style="background:var(--naranja-100)"><span class="n">100</span><span class="h">#FFDDCF</span></div>
    <div class="chip light" style="background:var(--naranja-200)"><span class="n">200</span><span class="h">#FFB89E</span></div>
    <div class="chip light" style="background:var(--naranja-300)"><span class="n">300</span><span class="h">#FB8D63</span></div>
    <div class="chip dark" style="background:var(--naranja-400)"><span class="n">400</span><span class="h">#F26336</span></div>
    <div class="chip dark" style="background:var(--naranja-500)"><span class="n">500</span><span class="h">#E34100</span></div>
    <div class="chip dark" style="background:var(--naranja-600)"><span class="n">600</span><span class="h">#C23500</span></div>
    <div class="chip dark" style="background:var(--naranja-700)"><span class="n">700</span><span class="h">#9C2B00</span></div>
    <div class="chip dark" style="background:var(--naranja-800)"><span class="n">800</span><span class="h">#762200</span></div>
    <div class="chip dark" style="background:var(--naranja-900)"><span class="n">900</span><span class="h">#511800</span></div>
  </div>
</body>
</html>
